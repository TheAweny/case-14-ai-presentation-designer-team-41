# Audit profiles. A profile switches checks on and sets their thresholds.
# Deterministic checks run in the Python engine, contextual ones on the TypeScript side.
# A deterministic check a profile does not mention runs with the defaults of its registry entry
# (engine/src/engine/checks/registry.py), which are the limits of the case requirements.
# docs/AUDIT.md is generated from the check registry, not written by hand.

profiles:
  default:
    description: Limits of the case requirements, used by every run unless a config overrides it.

    deterministic:
      slide-bounds:
        enabled: true
      text-clipped:
        enabled: true
      overlap:
        enabled: true
        minOverlapShare: 0.05
      text-overflow:
        enabled: true
      grid-alignment:
        enabled: true
      safe-margins:
        enabled: true
        minMarginPt: 18
      image-aspect:
        enabled: true
        maxDistortion: 0.02
      font-usage:
        enabled: true
        maxDistinctFonts: 2
      type-scale:
        enabled: true
      palette:
        enabled: true
      template-layout:
        enabled: true
      protected-zones:
        enabled: true
      contrast:
        enabled: true
        minContrastRatio: 4.5
      bullet-count:
        enabled: true
        maxBulletsPerSlide: 6
      bullet-length:
        enabled: true
        maxWordsPerBullet: 15
      table-size:
        enabled: true
        maxRows: 7
        maxColumns: 5
      chart-series:
        enabled: true
        maxSeries: 5
      slide-fill:
        enabled: true
        minFill: 0.25
        maxFill: 0.75
      placeholder-text:
        enabled: true
        forbiddenPatterns:
          - 'lorem ipsum'
          - 'вставьте текст'
          - 'xxx'
          - 'todo'
          - 'click to add'
          - 'нажмите, чтобы добавить'
          - 'заголовок слайда'

    # Content validation questions of the case, answered by a model per slide. A "no" becomes a
    # finding only when the model is at least this sure of it; below that it is reported as info.
    contextual:
      minConfidence: 0.6
      headline-states-conclusion:
        enabled: true
      slide-title-matches-body:
        enabled: true
      one-sentence-summary:
        enabled: true
      claim-supported-by-content-pack:
        enabled: true
      slide-has-content:
        enabled: true
      visuals-on-topic:
        enabled: true
      no-service-text:
        enabled: true
      no-typos:
        enabled: true
      single-language:
        enabled: true
      table-and-legend-serve-the-point:
        enabled: true
      narrative-order:
        enabled: true
      duplicate-message:
        enabled: true

  composition:
    description: >-
      Decks built from the template's own slides. Text fit is checked exactly by the composition
      typography, and geometry is the template's, so those checks are off here.
    inherits: default
    deterministic:
      text-overflow:
        enabled: false
      grid-alignment:
        enabled: false
      safe-margins:
        enabled: false
      protected-zones:
        enabled: false
      template-layout:
        enabled: false
      image-aspect:
        enabled: false

  strict:
    description: Tighter thresholds used when checking the result on an unfamiliar template.
    inherits: default
    deterministic:
      bullet-count:
        maxBulletsPerSlide: 5
      contrast:
        minContrastRatio: 7
      font-usage:
        maxDistinctFonts: 2
