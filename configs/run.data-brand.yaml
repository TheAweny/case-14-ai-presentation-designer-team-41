# A run on data and a brandbook: the regions workbook from examples/datasets, styled by the
# Northstar brandbook from examples/brandbooks. Validated against RunConfig.
#   lct generate configs/run.data-brand.yaml

# No templatePath: the deck is built on the built-in layouts (examples/layout-template.pptx), and
# the brandbook gives them its colours, fonts and logo.

# A table is read as typed data: a short one goes into the brief whole, a long one as a summary
# over all of its rows. CSV, TSV, XLSX, JSON, and tables inside .txt or .md are read this way.
contentPath: examples/datasets/xlsx/regions-sales.xlsx

# Design tokens, a PDF guideline, .fig, logos, fonts and slide examples, or a ZIP or RAR of them.
# Only rules the brandbook declares restyle the deck; colours merely seen in pictures do not.
brandbookPath: examples/brandbooks/northstar-brandbook.zip
# brandbook (default) or template: which wins where the two disagree.
brandbookPriority: brandbook

slideCount: 6
layoutVariants:
  - dense
  - balanced
  - airy
auditProfile: default
models:
  - role: planner
    modelId: planner-default
  - role: writer
    modelId: writer-default
  - role: critic
    modelId: critic-default
  - role: vision
    modelId: vision-default
seed: 20261020
outputDir: runs

goal: Показать, какие регионы выросли за 2025 год, а какие отстают, и где нужна поддержка продаж.
audience: Коммерческий директор
language: ru
