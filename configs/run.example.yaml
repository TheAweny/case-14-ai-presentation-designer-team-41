# Example run configuration. Validated against RunConfig from packages/contracts.
# It builds the decks the way the interface does, on the model the service is set up with
# (.env, see `lct onboard`). Run it as is, or copy it and point the paths at your own files:
#   lct generate configs/run.example.yaml
# The decks land in runs/<run>/<variant>/deck.pptx, with the PDF in previews/.

# Any .pptx works: the template is read as a set of rules, never matched against a known list.
templatePath: examples/template.pptx

# Content the deck is built from: text, figures, tables, as Markdown or plain text.
contentPath: examples/brief.md

# Number of slides in the produced deck. The contract allows 10 to 15.
slideCount: 10

# Layout variants built from one deck plan. The plan is computed once and reused by all of them.
layoutVariants:
  - dense
  - balanced
  - airy

# Audit profile from configs/audit.yaml.
auditProfile: default

# Catalogue entries of the roles, recorded with the run. The model that answers is the one the
# service is connected to (LLM_BASE_URL, LLM_MODEL and MODEL_HEADERS in .env).
models:
  - role: planner
    modelId: planner-default
  - role: writer
    modelId: writer-default
  - role: critic
    modelId: critic-default
  - role: vision
    modelId: vision-default

# Seed recorded in the run manifest; the same seed with the same versions repeats a run.
seed: 20260918

# Directory that receives artifacts: deck files, audit report, manifest, previews.
outputDir: runs

# What the deck has to achieve and for whom. Without goal the first paragraph of the content
# file is taken as the goal.
goal: Получить решение правления о масштабировании чат-бота на 8 регионов.
audience: Правление банка
language: ru
