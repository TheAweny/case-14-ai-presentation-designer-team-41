# Model catalogue. A run references these entries by id; the manifest records the resolved
# revision so a deck can be traced back to the exact weights that produced it.
# Validated against ModelCatalog from packages/contracts: open weights under Apache-2.0 or MIT,
# at most 35B parameters, revisions pinned to a commit.
#
# Fields:
#   id           - identifier used in run configs and agent configs
#   repo         - Hugging Face repository
#   revision     - pinned commit; never "main", so runs stay reproducible
#   license      - license of the weights
#   sizeB        - parameter count in billions, for capacity planning
#   type         - llm | vlm | text-to-image
#   provider     - openai-compatible (any runtime with the OpenAI chat API) | fake (recorded)
#   baseUrlEnv   - environment variable holding the base URL of that runtime
#   servedName   - name the runtime serves the model under, when it differs from repo
#
# Every role runs on one open multimodal MoE model: 35B weights with 3B active per token keep a
# 10-15 slide deck inside the 5 minute budget, and the same model reads slide images for the
# content validation questions. Thinking is switched off: the answers are JSON checked against a
# schema, and reasoning tokens would only spend the budget. The team serves it from Yandex AI
# Studio (OpenAI-compatible API); the served name there carries the cloud folder id, so it is set
# in .env as LLM_MODEL and VLM_MODEL rather than here.

models:
  - id: planner-default
    repo: Qwen/Qwen3.6-35B-A3B
    revision: 995ad96eacd98c81ed38be0c5b274b04031597b0
    license: Apache-2.0
    sizeB: 35
    type: llm
    provider: openai-compatible
    baseUrlEnv: LLM_BASE_URL
    extraBody:
      chat_template_kwargs:
        enable_thinking: false

  - id: writer-default
    repo: Qwen/Qwen3.6-35B-A3B
    revision: 995ad96eacd98c81ed38be0c5b274b04031597b0
    license: Apache-2.0
    sizeB: 35
    type: llm
    provider: openai-compatible
    baseUrlEnv: LLM_BASE_URL
    extraBody:
      chat_template_kwargs:
        enable_thinking: false

  - id: critic-default
    repo: Qwen/Qwen3.6-35B-A3B
    revision: 995ad96eacd98c81ed38be0c5b274b04031597b0
    license: Apache-2.0
    sizeB: 35
    type: llm
    provider: openai-compatible
    baseUrlEnv: LLM_BASE_URL
    extraBody:
      chat_template_kwargs:
        enable_thinking: false

  - id: vision-default
    repo: Qwen/Qwen3.6-35B-A3B
    revision: 995ad96eacd98c81ed38be0c5b274b04031597b0
    license: Apache-2.0
    sizeB: 35
    type: vlm
    provider: openai-compatible
    baseUrlEnv: VLM_BASE_URL
    extraBody:
      chat_template_kwargs:
        enable_thinking: false

  # A text-only fallback, if the multimodal model is not available on a runtime.
  - id: planner-fallback
    repo: openai/gpt-oss-20b
    revision: 6cee5e81ee83917806bbde320786a8fb61efebee
    license: Apache-2.0
    sizeB: 21
    type: llm
    provider: openai-compatible
    baseUrlEnv: LLM_BASE_URL

  - id: illustrator-default
    repo: black-forest-labs/FLUX.1-schnell
    revision: 741f7c3ce8b383c54771c7003378a50191e9efe9
    license: Apache-2.0
    sizeB: 12
    type: text-to-image
    provider: openai-compatible
    baseUrlEnv: IMAGE_BASE_URL

  # Answers from recorded responses under registry/recordings/. Used by tests and by the offline
  # demo; select it for every role with MODEL_PROVIDER=fake.
  - id: fake
    repo: lct26/recorded-responses
    revision: v1
    license: Apache-2.0
    sizeB: 1
    type: llm
    provider: fake
    baseUrlEnv: LLM_BASE_URL
