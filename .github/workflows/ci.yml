name: CI

# Mirrors .sourcecraft/ci.yaml: the same checks, so either host can be the one we submit.
on:
  push:
    branches: [main]
  pull_request:
  # Run by hand from the Actions tab or `gh workflow run CI --ref <branch>`.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Lint, types, boundaries, tests, build
    # Pinned: ubuntu-latest moves to Ubuntu 26 from 19.10, the day before the stop-code.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # 1. Dependencies — yarn and uv, both cached.
      # Corepack first: setup-node asks yarn for its cache folder, and the runner's global Yarn 1
      # refuses a project pinned to Yarn 4 in packageManager.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Enable Corepack for the installed Node
        run: corepack enable

      - name: Install Node dependencies
        run: yarn install --immutable

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --frozen

      # run-many, not affected, as on SourceCraft: a full run is short and needs no base commit.
      # 2. Lint.
      - name: Lint TypeScript
        run: yarn nx run-many -t lint

      - name: Lint Python
        run: uv run ruff check . && uv run ruff format --check .

      # 3. Types.
      - name: Typecheck TypeScript
        run: yarn nx run-many -t typecheck

      - name: Typecheck Python
        run: uv run pyright

      # 4. Layer boundaries. The TypeScript rules run inside ESLint above; this is the engine.
      - name: Check engine import boundaries
        run: uv run lint-imports --config engine/pyproject.toml

      # 5. Generated contracts must match the schemas that are committed.
      - name: Check codegen is up to date
        run: |
          yarn codegen
          git diff --exit-code -- packages/contracts/schema engine/src/engine/contracts/_generated.py

      # 5a. Golden fixtures are real parser output. A change in what the engine emits has to be
      # reviewed as a diff, not discovered by the team consuming it.
      - name: Check golden fixtures match the parser
        run: uv run write-golden-ir --check

      # 6. Tests. The contract suites run the shared fixtures through both Zod and Pydantic, so
      # an incompatible schema change fails here even when codegen itself succeeds.
      - name: Test TypeScript
        run: yarn nx run-many -t test

      - name: Test Python
        run: uv run pytest

      # 7. Build.
      - name: Build
        run: yarn nx run-many -t build

  licenses:
    name: Dependency license policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      # Corepack first: setup-node asks yarn for its cache folder, and the runner's global Yarn 1
      # refuses a project pinned to Yarn 4 in packageManager.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Enable Corepack for the installed Node
        run: corepack enable

      - name: Install Node dependencies
        run: yarn install --immutable

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --frozen

      # The product is open source: GPL and AGPL in the dependency tree fail the build.
      - name: Check dependency licenses
        run: yarn licenses

  docs-runtime:
    name: Static docs container
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build static docs image
        run: docker build -f infra/docker/docs.Dockerfile -t lct-docs:test .
      - name: Serve docs without product services
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name lct-docs --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
            --user 101:101 -p 127.0.0.1:3002:8080 lct-docs:test
          trap 'docker logs lct-docs; docker rm -f lct-docs' EXIT
          curl --fail --retry 10 --retry-all-errors --retry-delay 2 --max-time 10 http://127.0.0.1:3002/ > /dev/null
          curl --fail http://127.0.0.1:3002/docs/api/reference/ > /dev/null
          curl --fail http://127.0.0.1:3002/openapi.json > /dev/null
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:3002/missing-page/)" = 404
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:3002/api/backend/health)" = 404
