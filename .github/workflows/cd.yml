name: Production CD

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-lct
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
      REGISTRY: ghcr.io/theaweny/case-14-ai-presentation-designer-team-41
    steps:
      - name: Require successful CI for current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$RELEASE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=30" \
            --jq '.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch") | .head_sha' \
            | grep -Fx "$RELEASE_SHA"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish immutable application images
        shell: bash
        run: |
          set -euo pipefail
          for service in engine api web; do
            docker buildx build --platform linux/amd64 \
              --file "infra/docker/$service.Dockerfile" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$RELEASE_SHA" \
              --tag "$REGISTRY/$service:$RELEASE_SHA" \
              --cache-from "type=registry,ref=$REGISTRY/$service:buildcache" \
              --cache-to "type=registry,ref=$REGISTRY/$service:buildcache,mode=max" \
              --metadata-file "$RUNNER_TEMP/$service.json" --push .
          done

      - name: Deploy through restricted SSH receiver
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.LCT_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.LCT_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          key_file="$RUNNER_TEMP/lct-deploy-key"
          hosts_file="$RUNNER_TEMP/lct-known-hosts"
          trap 'rm -f "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts_file"
          python3 - <<'PY' | ssh -T -i "$key_file" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$hosts_file" -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 lct-deploy@111.88.131.31
          import json
          import os
          from pathlib import Path
          images = {}
          for service in ('api', 'web', 'engine'):
              metadata = json.loads((Path(os.environ['RUNNER_TEMP']) / f'{service}.json').read_text())
              images[service] = f"{os.environ['REGISTRY']}/{service}@{metadata['containerimage.digest']}"
          print(json.dumps({'sha': os.environ['RELEASE_SHA'], 'actor': os.environ['GITHUB_ACTOR'],
                            'token': os.environ['GH_TOKEN'], 'images': images}))
          PY

      - name: Check public HTTPS and record release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 https://lct.aweny.link/login > /dev/null
          printf 'Deployed commit `%s` to https://lct.aweny.link\n' "$RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
