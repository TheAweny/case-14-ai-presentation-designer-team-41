[project]
name = "lct-tools"
version = "0.1.0"
description = "Development utilities: fixtures, evaluation runs and generated documentation."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "pyyaml>=6.0.2",
]

[project.scripts]
generate-audit-docs = "lct_tools.audit_docs:main"
generate-license-report = "lct_tools.license_report:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lct_tools"]
