# Plans the deck: which slides, in what order, saying what, grounded in the content pack.
# The plan is made once per run and every layout variant is built from it.

id: deck-planner
version: 2.6.1
description: 'Plans a CompositionPlan: an exact requested 10-15 slides or an automatic 10-60 slides.'
modelId: planner-default

generation:
  temperature: 0.3
  topP: 0.9
  maxOutputTokens: 8192

outputSchema: CompositionPlan
instructionsFile: instructions.md
