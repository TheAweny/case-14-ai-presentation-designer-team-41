# Reads what every composition of an uploaded template is for, once, while the template is
# prepared. Runs outside the timed generation stage; its notes are cached with the profile.
id: template-indexer
version: 1.5.0
description: Describes each template composition for the planner and marks reference pages.
modelId: planner-default
generation:
  temperature: 0.1
  topP: 1
  maxOutputTokens: 4096
outputSchema: TemplateIndex
instructionsFile: instructions.md
