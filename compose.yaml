# Open-source local stack. PostgreSQL stores lifecycle and artifact metadata; generated files stay
# in the runs volume. The engine and database are internal services.
name: lct26

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lct26}
      POSTGRES_USER: ${POSTGRES_USER:-lct26}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lct26-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lct26} -d ${POSTGRES_DB:-lct26}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  engine:
    build:
      context: .
      dockerfile: infra/docker/engine.Dockerfile
    environment:
      ENGINE_LOG_LEVEL: ${ENGINE_LOG_LEVEL:-info}
    volumes:
      - ./data:/app/data
      - ./runs:/app/runs
      - ${TEMPLATE_FONTS_DIR:-./data/fonts}:/usr/local/share/fonts/template:ro
    expose:
      - '8000'
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      engine:
        condition: service_healthy
    environment:
      API_PORT: '3001'
      DATABASE_URL: postgresql://${POSTGRES_USER:-lct26}:${POSTGRES_PASSWORD:-lct26-local}@postgres:5432/${POSTGRES_DB:-lct26}
      ENGINE_URL: http://engine:8000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      MASTRA_STORAGE_URL: ${MASTRA_STORAGE_URL:-file:/app/runs/mastra.db}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      VLM_BASE_URL: ${VLM_BASE_URL:-}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./runs:/app/runs
    ports:
      - '3001:3001'
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: '3000'
      AUTH_SECRET: ${AUTH_SECRET:-lct26-local-auth-secret-change-me}
      AUTH_USERS: ${AUTH_USERS:-admin@example.com:123123:Administrator}
      API_INTERNAL_URL: http://api:3001
    ports:
      - '3000:3000'
    restart: unless-stopped

volumes:
  postgres-data:
