# Open-source local stack. PostgreSQL stores lifecycle and artifact metadata; generated files stay
# in the runs volume. The engine and database are internal services.
name: lct26

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lct26}
      POSTGRES_USER: ${POSTGRES_USER:-lct26}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lct26-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Loopback only: for the API and CLI run on the host. The password in .env.example is public.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lct26} -d ${POSTGRES_DB:-lct26}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  engine:
    build:
      context: .
      dockerfile: infra/docker/engine.Dockerfile
    environment:
      ENGINE_LOG_LEVEL: ${ENGINE_LOG_LEVEL:-info}
    volumes:
      - ./data:/app/data
      - ./runs:/app/runs
      - ${TEMPLATE_FONTS_DIR:-./data/fonts}:/usr/local/share/fonts/template:ro
    expose:
      - '8000'
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      engine:
        condition: service_healthy
    environment:
      # The first administrator, written by `lct onboard`. Made at start if that account does not
      # exist; later the password lives in the database and is changed in the interface.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      # Older list of accounts: missing ones are made at start, existing ones are left alone.
      AUTH_USERS: ${AUTH_USERS:-}
      # The API answers only requests carrying this token, which only the web server has.
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN:-}
      # Encrypts model keys stored from the interface. Only the API holds it.
      MODEL_KEYS_SECRET: ${MODEL_KEYS_SECRET:-}
      MODEL_ALLOW_PRIVATE_HOSTS: ${MODEL_ALLOW_PRIVATE_HOSTS:-false}
      API_PORT: '3001'
      DATABASE_URL: postgresql://${POSTGRES_USER:-lct26}:${POSTGRES_PASSWORD:-lct26-local}@postgres:5432/${POSTGRES_DB:-lct26}
      ENGINE_URL: http://engine:8000
      MASTRA_STORAGE_URL: ${MASTRA_STORAGE_URL:-file:/app/runs/mastra.db}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      VLM_BASE_URL: ${VLM_BASE_URL:-}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_HEADERS: ${MODEL_HEADERS:-}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-}
      MODEL_JSON_MODE: ${MODEL_JSON_MODE:-schema}
      MODEL_MAX_CONCURRENCY: ${MODEL_MAX_CONCURRENCY:-8}
      VLM_MODEL: ${VLM_MODEL:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-}
      IMAGE_MAX_CONCURRENCY: ${IMAGE_MAX_CONCURRENCY:-3}
      RECORDINGS_DIR: /app/registry/recordings
    volumes:
      - ./data:/app/data
      - ./runs:/app/runs
    # Published on the loopback only, for `next dev` and the installer's health check. Browsers
    # never reach it: they go through the web server, which adds the service token.
    ports:
      - '127.0.0.1:3001:3001'
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: '3000'
      # Address of the API as the web server sees it. Browsers talk only to the web server, whose
      # /api/backend route forwards their requests here with the service token.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3001}
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN:-}
      # Signs the sessions of the interface; `lct onboard` writes it into .env. Accounts live in
      # the API's database.
      AUTH_SECRET: ${AUTH_SECRET:-}
    ports:
      - '3000:3000'
    restart: unless-stopped

volumes:
  postgres-data:
