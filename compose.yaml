# Open-source local stack. PostgreSQL stores lifecycle and artifact metadata; generated files stay
# in the runs volume. The engine and database are internal services.
name: lct26

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lct26}
      POSTGRES_USER: ${POSTGRES_USER:-lct26}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lct26-local}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Loopback only: for the API and CLI run on the host. The password in .env.example is public.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lct26} -d ${POSTGRES_DB:-lct26}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  engine:
    build:
      context: .
      dockerfile: infra/docker/engine.Dockerfile
    environment:
      ENGINE_LOG_LEVEL: ${ENGINE_LOG_LEVEL:-info}
    volumes:
      - ./data:/app/data
      - ./runs:/app/runs
      - ${TEMPLATE_FONTS_DIR:-./data/fonts}:/usr/local/share/fonts/template:ro
    expose:
      - '8000'
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      engine:
        condition: service_healthy
    environment:
      # The first administrator, written by `lct onboard`. Made at start if that account does not
      # exist; later the password lives in the database and is changed in the interface.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-}
      # Older list of accounts: missing ones are made at start, existing ones are left alone.
      AUTH_USERS: ${AUTH_USERS:-}
      # The API answers only requests carrying this token, which only the web server has.
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN:-}
      # Encrypts model keys stored from the interface. Only the API holds it.
      MODEL_KEYS_SECRET: ${MODEL_KEYS_SECRET:-}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      MODEL_ALLOW_PRIVATE_HOSTS: ${MODEL_ALLOW_PRIVATE_HOSTS:-false}
      API_PORT: '3001'
      DATABASE_URL: postgresql://${POSTGRES_USER:-lct26}:${POSTGRES_PASSWORD:-lct26-local}@postgres:5432/${POSTGRES_DB:-lct26}
      ENGINE_URL: http://engine:8000
      # Unset -> http://search:8080. An explicit empty value disables search.
      # Dash, not colon-dash: WEB_SEARCH_URL= stays empty and does not fall back.
      WEB_SEARCH_URL: ${WEB_SEARCH_URL-http://search:8080}
      MASTRA_STORAGE_URL: ${MASTRA_STORAGE_URL:-file:/app/runs/mastra.db}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      VLM_BASE_URL: ${VLM_BASE_URL:-}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      SPEECH_BASE_URL: ${SPEECH_BASE_URL:-}
      SPEECH_MODEL: ${SPEECH_MODEL:-}
      SPEECH_API_KEY: ${SPEECH_API_KEY:-}
      SPEECH_HEADERS: ${SPEECH_HEADERS:-}
      SPEECH_PROVIDER: ${SPEECH_PROVIDER:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_HEADERS: ${MODEL_HEADERS:-}
      MODEL_REASONING_TOGGLE: ${MODEL_REASONING_TOGGLE:-}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-}
      MODEL_PROTOCOL: ${MODEL_PROTOCOL:-}
      MODEL_JSON_MODE: ${MODEL_JSON_MODE:-schema}
      MODEL_MAX_CONCURRENCY: ${MODEL_MAX_CONCURRENCY:-8}
      GENERATION_CONCURRENCY: ${GENERATION_CONCURRENCY:-3}
      GENERATION_DEADLINE_MS: ${GENERATION_DEADLINE_MS:-270000}
      VLM_MODEL: ${VLM_MODEL:-}
      IMAGE_MODEL: ${IMAGE_MODEL:-}
      IMAGE_PROVIDER: ${IMAGE_PROVIDER:-}
      IMAGE_MAX_CONCURRENCY: ${IMAGE_MAX_CONCURRENCY:-3}
      RECORDINGS_DIR: /app/registry/recordings
    volumes:
      - ./data:/app/data
      - ./runs:/app/runs
    # Published on the loopback only, for `next dev` and the installer's health check. Browsers
    # never reach it: they go through the web server, which adds the service token.
    ports:
      - '127.0.0.1:${API_HOST_PORT:-3001}:3001'
    restart: unless-stopped

  search:
    profiles: ['search']
    image: searxng/searxng@sha256:8bdd9aa136b2dc3b9332cf24714fa34a375b8a1949a1201ec900c24d7378596e
    environment:
      # Empty or unset: the command below generates a process-local key and does not persist it.
      # A non-empty value from the uncommitted .env is kept across restarts. Never commit it.
      SEARXNG_SECRET: ${SEARXNG_SECRET-}
      SEARXNG_BASE_URL: http://search:8080/
      # The settings file is mounted read-only; the image must not chown that directory.
      FORCE_OWNERSHIP: 'false'
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - search-data:/var/cache/searxng
    # Official image entrypoint. An empty SEARXNG_SECRET would overwrite server.secret_key with
    # an empty string, so generate one in the process environment before exec.
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        if [ -z "$$SEARXNG_SECRET" ]; then
          # Same tools as the image entrypoint. `python` is not on PATH before the venv starts.
          SEARXNG_SECRET="$$(head -c 32 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9')"
          export SEARXNG_SECRET
        fi
        exec /usr/local/searxng/entrypoint.sh
    expose:
      - '8080'
    mem_limit: 512m
    cpus: 0.50
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: '3000'
      # Address of the API as the web server sees it. Browsers talk only to the web server, whose
      # /api/backend route forwards their requests here with the service token.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3001}
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN:-}
      # Signs the sessions of the interface; `lct onboard` writes it into .env. Accounts live in
      # the API's database.
      AUTH_SECRET: ${AUTH_SECRET:-}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      APP_ORIGIN: ${APP_ORIGIN:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - '${WEB_BIND:-0.0.0.0}:${WEB_PORT:-3000}:3000'
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    profiles: ['https']
    environment:
      LCT_DOMAIN: ${LCT_DOMAIN:-localhost}
    depends_on:
      web:
        condition: service_started
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  postgres-data:
  search-data:
  caddy-data:
  caddy-config:
