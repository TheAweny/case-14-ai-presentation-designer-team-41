[project]
name = "engine"
version = "0.1.0"
description = "Deterministic document engine: parses a template, lays out a deck, audits and exports it."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "pydantic>=2.13.5",
    "python-pptx>=1.0.2",
    "pillow>=12.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

# Layer boundaries of the engine. The layers never import each other; only the API ties them
# together. Loosening a contract here means changing the architecture, not the config.
[tool.importlinter]
root_package = "engine"

[[tool.importlinter.contracts]]
name = "API sits above independent layers, which sit above contracts"
type = "layers"
layers = [
    "api",
    "parser | layout | visuals | export | render | checks",
    "contracts",
]
containers = ["engine"]

[[tool.importlinter.contracts]]
name = "Engine layers are independent of each other"
type = "independence"
modules = [
    "engine.parser",
    "engine.layout",
    "engine.visuals",
    "engine.export",
    "engine.render",
    "engine.checks",
]

[[tool.importlinter.contracts]]
name = "Contracts import nothing from the engine"
type = "forbidden"
source_modules = ["engine.contracts"]
forbidden_modules = [
    "engine.parser",
    "engine.layout",
    "engine.visuals",
    "engine.export",
    "engine.render",
    "engine.checks",
    "engine.api",
]
